server:
  port: 8091

spring:
  application:
    name: system-a-rest
  datasource:
    url: jdbc:h2:mem:systema
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
